[package]
name = "vimcore"
description = "A host-agnostic Vim engine: modes, motions, operators, text objects, registers, search and marks."
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/vimcore"
readme = "README.md"
keywords = ["vim", "editor", "engine", "modal", "tui"]
categories = ["text-processing", "command-line-interface"]
# in-repo Chinese-to-English migration plan and its guard rails; working
# conventions only, not published with the crate
exclude = ["I18N_PLAN.md", ".cjk-allow", "tools/", ".github/"]

[dependencies]
regex = "1"
unicode-width = "0.2"

[dev-dependencies]
# ropey-backed buffer for the bench probe's "good host" cases
# (examples/bench_probe.rs)
ropey = "1"

[profile.dev]
opt-level = 1

# the fuzz suites (fuzz_round7-13) exhaust the pipeline budget under the test
# profile (macro self-recursion: the @a queue can replay 100k keys); an
# opt-level 1 debug build takes 78s — the test profile is raised to 3 to push
# the replay path back to seconds (incremental-compilation cost acceptable,
# see the performance section of NOTES)
[profile.test]
opt-level = 3
