[package]
name = "vimcore"
description = "A host-agnostic Vim engine: modes, motions, operators, text objects, registers, search and marks."
version = "0.1.23"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/vimcore"
readme = "README.md"
keywords = ["vim", "editor", "engine", "modal", "tui"]
categories = ["text-processing", "command-line-interface"]

[dependencies]
regex = "1"
unicode-width = "0.2"

[dev-dependencies]
# ropey-backed buffer for the bench probe's "good host" cases
# (examples/bench_probe.rs)
ropey = "1"

[profile.dev]
opt-level = 1

# fuzz 套件（fuzz_round7-13）在 test profile 下跑满管线预算（宏自递归的
# @a 队列可重放 10 万键），opt-level 1 的调试构建要 78s——测试配置提到
# 3，把重放路径压回秒级（增量编译代价可接受，见 NOTES 性能节）
[profile.test]
opt-level = 3
