[package]
name = "vimcore"
description = "A host-agnostic Vim engine: modes, motions, operators, text objects, registers, search and marks."
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lex"]
repository = "https://github.com/beyondlex/vimcore"
readme = "README.md"
keywords = ["vim", "editor", "engine", "modal", "tui"]
categories = ["text-processing", "command-line-interface"]

[dependencies]
regex = "1"
unicode-width = "0.2"

[dev-dependencies]
# ropey-backed buffer for the bench probe's "good host" cases
# (examples/bench_probe.rs)
ropey = "1"

[profile.dev]
opt-level = 1
