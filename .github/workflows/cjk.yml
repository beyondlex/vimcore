name: cjk

# vimcore is an English-only codebase. This guard exists because the
# Chinese-to-English migration (2026-10-14, see I18N_PLAN.md) is only durable
# if something stops the next CJK comment from landing. Multibyte test data is
# exempted per-file with a reason in .cjk-allow.

on:
  push:
  pull_request:

jobs:
  whitelist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject CJK outside .cjk-allow
        run: bash tools/check_cjk.sh
